name: 3대 리그 자료 수집

on:
  schedule:
    - cron: "23 0 * * *"   # 매일 09:23 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-report
  cancel-in-progress: false

defaults:
  run:
    working-directory: football-report

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 자료 수집
        run: python run.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- data site exports 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "자료 수집 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash || true
            git push
          fi
